<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Drill — AI Prep Hub</title>
  <link rel="stylesheet" href="css/app.css"/>
  <style>
    /* ── Mobile sidebar toggle ────────────────────────────── */
    .mob-filter-btn {
      display: none;
      align-items: center; gap: 7px;
      padding: 7px 13px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text); font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: var(--font);
      margin-bottom: 14px;
    }
    @media (max-width: 768px) {
      .mob-filter-btn { display: flex; }
      .sidebar-overlay {
        display: none; position: fixed; inset: 0;
        background: rgba(0,0,0,0.55); z-index: 190;
      }
      .sidebar-overlay.open { display: block; }
      #sidebar-filters {
        position: fixed; top: 54px; left: 0;
        height: calc(100vh - 54px); z-index: 195;
        transform: translateX(-100%); transition: transform 0.25s ease;
        display: block !important; /* override the hide-on-mobile rule */
        width: 260px;
      }
      #sidebar-filters.open { transform: translateX(0); }
    }

    /* ── Action buttons ───────────────────────────────────── */
    .action-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      background: rgba(0,0,0,0.10);
      flex-wrap: wrap;
    }
    .action-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      font-size: 12px; font-weight: 700;
      cursor: pointer; transition: all 0.15s;
      font-family: var(--font);
    }
    .action-btn:disabled, .action-btn.locked {
      opacity: 0.28; cursor: not-allowed; pointer-events: none;
    }
    .btn-note-q {
      background: transparent !important;
      color: var(--muted) !important;
      border: 1px solid var(--border) !important;
      font-size: 13px !important;
      padding: 5px 10px !important;
    }
    .btn-note-q:hover { color: var(--gold) !important; border-color: var(--gold-border) !important; }
    .btn-note-q.has-note { color: var(--gold) !important; border-color: var(--gold-border) !important; background: var(--gold-bg) !important; }
    .btn-reset-q {
      background: transparent !important;
      color: var(--muted) !important;
      border: 1px solid var(--border) !important;
      margin-left: auto;
    }
    .btn-reset-q:hover { color: var(--text) !important; border-color: var(--muted2) !important; }
    /* Learn — blue */
    .btn-learn {
      background: var(--blue-bg);
      color: var(--blue);
      border-color: var(--blue-border);
    }
    .btn-learn:hover, .btn-learn.active {
      background: rgba(91,164,245,0.18);
      border-color: var(--blue);
    }
    /* Done — green */
    .btn-done {
      background: var(--green-bg);
      color: var(--green);
      border-color: var(--green-border);
    }
    .btn-done:hover, .btn-done.active {
      background: rgba(62,207,142,0.18);
      border-color: var(--green);
      box-shadow: 0 0 0 2px var(--green-glow);
    }
    /* Revised — orange */
    .btn-revised {
      background: var(--orange-bg);
      color: var(--orange);
      border-color: var(--orange-border);
    }
    .btn-revised:hover, .btn-revised.active {
      background: rgba(249,123,61,0.18);
      border-color: var(--orange);
    }
    /* Counter badge */
    .count-badge {
      font-size: 10px; font-weight: 800;
      background: rgba(255,255,255,0.12);
      padding: 1px 6px; border-radius: 99px;
      min-width: 18px; text-align: center;
    }
    /* State indicator dot */
    .state-dot {
      width: 8px; height: 8px;
      border-radius: 50%; flex-shrink: 0;
      background: var(--border);
    }
    .state-dot.learn   { background: var(--blue); }
    .state-dot.done    { background: var(--green); }
    .state-dot.revised { background: var(--orange); }

    /* ── Question card ────────────────────────────────────── */
    .q-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .q-card:hover { border-color: #3A3828; }
    .q-card.state-learn   { border-left: 3px solid var(--blue); }
    .q-card.state-done    { border-left: 3px solid var(--green); box-shadow: inset 3px 0 12px var(--green-glow); }
    .q-card.state-revised { border-left: 3px solid var(--orange); }

    .q-card-header {
      padding: 13px 17px; cursor: pointer;
      display: flex; align-items: flex-start; gap: 12px;
      transition: background 0.15s;
    }
    .q-card-header:hover { background: rgba(255,255,255,0.02); }
    .q-num  { font-size: 10.5px; font-weight: 700; color: var(--muted2); min-width: 26px; padding-top: 2px; font-family: var(--font-mono); }
    .q-text { font-size: 13.5px; color: var(--text); flex: 1; line-height: 1.65; }
    .q-meta { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
    .q-chev { font-size: 10px; color: var(--muted2); transition: transform 0.2s; }

    /* Answer panel */
    .q-body { display: none; border-top: 1px solid var(--border); }
    .q-body.open { display: block; }
    .q-body-inner {
      padding: 14px 17px;
      background: var(--gold-bg);
      border-left: 3px solid var(--gold);
    }
    .q-answer-label {
      font-size: 9.5px; font-weight: 800;
      text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--gold); margin-bottom: 8px;
    }
    .q-answer pre {
      background: var(--code-bg); border: 1px solid var(--code-border);
      border-radius: var(--radius-sm); padding: 12px 14px;
      font-size: 12px; font-family: var(--font-mono);
      white-space: pre; overflow-x: auto; color: var(--code-text);
    }

    /* ── Session bar ──────────────────────────────────────── */
    .session-bar {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 20px;
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    }
    .s-stat .val { font-size: 22px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
    .s-stat .lbl { font-size: 9.5px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

    .section-group { margin-bottom: 28px; }
    .section-group-hdr {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px; font-size: 14px; font-weight: 700; color: var(--text);
    }

    /* Legend */
    .legend-row { display: flex; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
    .legend-row span { display: flex; align-items: center; gap: 5px; font-weight: 600; }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

  <div class="layout">
    <!-- Sidebar: section filters -->
    <aside class="sidebar" id="sidebar-filters">
      <div style="padding:14px 16px; border-bottom:1px solid var(--border);">
        <div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:10px;">Filter by Section</div>
        <div id="section-filters"></div>
      </div>
      <div style="padding:14px 16px;">
        <div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:10px;">Filter by Status</div>
        <div id="status-filters">
          <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:8px;cursor:pointer;">
            <input type="checkbox" value="none" checked onchange="applyFilters()"/> Not started
          </label>
          <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--blue);margin-bottom:8px;cursor:pointer;">
            <input type="checkbox" value="learn" checked onchange="applyFilters()"/> 📖 Learned
          </label>
          <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--green);margin-bottom:8px;cursor:pointer;">
            <input type="checkbox" value="done" checked onchange="applyFilters()"/> ✅ Done
          </label>
          <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--orange);margin-bottom:8px;cursor:pointer;">
            <input type="checkbox" value="revised" checked onchange="applyFilters()"/> 🔁 Revised
          </label>
        </div>
      </div>
    </aside>

    <main class="main">
      <!-- Mobile filter button -->
      <button class="mob-filter-btn" onclick="openSidebar()">☰ Filters</button>
      <header class="page-header">
        <h1>Drill Questions</h1>
        <p>Read each answer → mark <strong style="color:var(--blue)">Learn</strong> (first time) · <strong style="color:var(--green)">Done</strong> (I got it) · <strong style="color:var(--orange)">Revise</strong> (need more work). Counters track how many times.</p>
      </header>

      <!-- Session stats -->
      <div class="session-bar">
        <div class="s-stat"><div class="val" style="color:var(--muted)" id="s-total">0</div><div class="lbl">Total Qs</div></div>
        <div class="s-stat"><div class="val" style="color:var(--blue)"   id="s-learn">0</div><div class="lbl">📖 Learned</div></div>
        <div class="s-stat"><div class="val" style="color:var(--green)"  id="s-done">0</div><div class="lbl">✅ Done</div></div>
        <div class="s-stat"><div class="val" style="color:var(--orange)" id="s-revised">0</div><div class="lbl">🔁 Revised</div></div>
        <div style="flex:1"></div>
        <button class="btn btn-primary" onclick="expandAll()">Expand All</button>
        <button class="btn btn-reset"   onclick="collapseAll()">Collapse All</button>
      </div>

      <!-- Legend -->
      <div class="legend-row">
        <span><span style="width:10px;height:10px;border-radius:50%;background:var(--blue);display:inline-block"></span> Learn — reading for first time</span>
        <span><span style="width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block"></span> Done — understood it</span>
        <span><span style="width:10px;height:10px;border-radius:50%;background:var(--orange);display:inline-block"></span> Revise — need more work</span>
      </div>

      <div id="q-content"></div>
    </main>
  </div>

<script src="js/common.js"></script>
<script src="js/data.js"></script>
<script>
let allSections  = [];
let allQuestions = [];
let todayActions = {}; // "topicId::qIdx" → lastAction today
let qCounts      = {}; // "topicId::qIdx" → { learn, done, revised }
const qMetaMap   = {}; // "topicId::qIdx" → { q, chapter, chapter_title, section_id, section_num }

function buildFlatList(sections) {
  const list = [];
  sections.forEach(sec => {
    sec.topics.forEach(topic => {
      (topic.drill || []).forEach((d, i) => {
        const key = `${topic.id}::${i}`;
        qMetaMap[key] = {
          q:             d.q,
          chapter:       sec.chapter       || 0,
          chapter_title: sec.chapter_title || '',
          section_id:    sec.id,
          section_num:   sec.section_num   || '',
        };
        list.push({
          secId: sec.id, secTitle: sec.title, secIcon: sec.icon,
          topicId: topic.id, topicTitle: topic.title,
          qIdx: i, q: d.q, a: d.a
        });
      });
    });
  });
  return list;
}

function getLastAction(topicId, qIdx) {
  const k = `${topicId}::${qIdx}`;
  return qCounts[k]?.last || null;
}

function renderQCard(item, globalIdx) {
  const key    = `${item.topicId}::${item.qIdx}`;
  const counts = qCounts[key] || { learn: 0, done: 0, revised: 0, last: null };
  const last   = counts.last;
  const stateClass = last ? `state-${last}` : '';

  const bodyId = `qb-${item.topicId}-${item.qIdx}`;
  const chevId = `qc-${item.topicId}-${item.qIdx}`;

  return `
    <div class="q-card ${stateClass}" id="qcard-${item.topicId}-${item.qIdx}">
      <div class="q-card-header" onclick="toggleQ('${bodyId}','${chevId}')">
        <span class="q-num">${globalIdx + 1}</span>
        <span class="q-text">${escHtml(item.q)}</span>
        <div class="q-meta">
          <span class="badge badge-section" style="font-size:9px">${escHtml(item.secIcon)} ${escHtml(item.topicTitle)}</span>
          <span class="state-dot ${last || ''}" id="dot-${item.topicId}-${item.qIdx}" title="${last || 'not started'}"></span>
          <span class="q-chev" id="${chevId}">▶</span>
        </div>
      </div>
      <div class="q-body" id="${bodyId}">
        <div class="q-body-inner">
          <div class="q-answer-label">💡 Answer</div>
          <pre>${escHtml(item.a)}</pre>
        </div>
        <div class="action-row">
          <button class="action-btn btn-learn${last === 'learn' ? ' active' : ''}${counts.done > 0 ? ' locked' : ''}"
            id="bl-${item.topicId}-${item.qIdx}"
            onclick="markQ('${item.topicId}',${item.qIdx},'learn')">
            📖 Learn <span class="count-badge" id="cl-${item.topicId}-${item.qIdx}">${counts.learn || 0}</span>
          </button>
          <button class="action-btn btn-done${last === 'done' ? ' active' : ''}${(counts.learn === 0 || counts.done > 0) ? ' locked' : ''}"
            id="bd-${item.topicId}-${item.qIdx}"
            onclick="markQ('${item.topicId}',${item.qIdx},'done')">
            ✅ Done <span class="count-badge" id="cd-${item.topicId}-${item.qIdx}">${counts.done || 0}</span>
          </button>
          <button class="action-btn btn-revised${last === 'revised' ? ' active' : ''}${counts.learn === 0 ? ' locked' : ''}"
            id="br-${item.topicId}-${item.qIdx}"
            onclick="markQ('${item.topicId}',${item.qIdx},'revised')">
            🔁 Revise <span class="count-badge" id="cr-${item.topicId}-${item.qIdx}">${counts.revised || 0}</span>
          </button>
          <button class="action-btn btn-reset-q"
            id="bx-${item.topicId}-${item.qIdx}"
            onclick="resetQ('${item.topicId}',${item.qIdx})">
            ↺ Reset <span class="count-badge" id="cx-${item.topicId}-${item.qIdx}">${counts.reset || 0}</span>
          </button>
          <button class="action-btn btn-note-q${Store.getNote(item.topicId+'::'+item.qIdx) ? ' has-note' : ''}"
            id="nb-${item.topicId}-${item.qIdx}"
            data-nkey="${item.topicId}::${item.qIdx}"
            data-ntitle="${escHtml(item.q).slice(0,80)}"
            data-nsub="${escHtml(item.topicTitle)}"
            onclick="openNotesModal(this.dataset.nkey, this.dataset.ntitle, this.dataset.nsub)">
            📝
          </button>
        </div>
      </div>
    </div>`;
}

function renderQuestions(questions) {
  const content = document.getElementById('q-content');
  if (!questions.length) {
    content.innerHTML = `<div class="empty"><div class="big">✅</div><p>No questions match your filters.</p></div>`;
    return updateSessionStats();
  }
  const grouped = {};
  questions.forEach((q, i) => {
    if (!grouped[q.secId]) grouped[q.secId] = { sec: q, items: [] };
    grouped[q.secId].items.push({ ...q, globalIdx: i });
  });
  content.innerHTML = Object.values(grouped).map(g => `
    <div class="section-group">
      <div class="section-group-hdr">${g.sec.secIcon} ${escHtml(g.sec.secTitle)}</div>
      ${g.items.map(item => renderQCard(item, item.globalIdx)).join('')}
    </div>`).join('');
  updateSessionStats();
}

function updateSessionStats() {
  const total   = allQuestions.length;
  const counts  = Store.getQCounts();
  const all     = Object.values(counts);
  // Unique questions per last-action (all-time)
  const learnU  = all.filter(v => v.learn > 0).length;
  const doneU   = all.filter(v => v.done  > 0).length;
  const revisedU= all.filter(v => v.revised > 0).length;

  document.getElementById('s-total').textContent   = total;
  document.getElementById('s-learn').textContent   = learnU;
  document.getElementById('s-done').textContent    = doneU;
  document.getElementById('s-revised').textContent = revisedU;
}

function markQ(topicId, qIdx, action) {
  // Hard gate — check DOM lock state (covers pointer-events CSS gap)
  const btnIdMap = { learn: `bl-${topicId}-${qIdx}`, done: `bd-${topicId}-${qIdx}`, revised: `br-${topicId}-${qIdx}` };
  const btn = document.getElementById(btnIdMap[action]);
  if (btn && btn.classList.contains('locked')) return;

  const key  = `${topicId}::${qIdx}`;
  if (!qCounts[key]) qCounts[key] = { learn: 0, done: 0, revised: 0, last: null };
  const c = qCounts[key];

  const meta = qMetaMap[key] || { q: '', chapter: 0, chapter_title: '', section_id: topicId, section_num: '' };
  Store.markQuestion(topicId, qIdx, action, meta);

  c[action]++;
  c.last = action;

  // Update card state class
  const card = document.getElementById(`qcard-${topicId}-${qIdx}`);
  if (card) {
    card.classList.remove('state-learn', 'state-done', 'state-revised');
    card.classList.add(`state-${action}`);
  }

  // Update dot
  const dot = document.getElementById(`dot-${topicId}-${qIdx}`);
  if (dot) { dot.className = `state-dot ${action}`; dot.title = action; }

  // Update button active + locked states + counter
  const btnLearn   = document.getElementById(`bl-${topicId}-${qIdx}`);
  const btnDone    = document.getElementById(`bd-${topicId}-${qIdx}`);
  const btnRevised = document.getElementById(`br-${topicId}-${qIdx}`);

  if (btnLearn) {
    btnLearn.classList.toggle('active', action === 'learn');
    // Lock Learn only after Done is clicked
    btnLearn.classList.toggle('locked', c.done > 0);
  }
  if (btnDone) {
    btnDone.classList.toggle('active', action === 'done');
    // Unlock Done once Learn clicked; lock permanently after Done clicked once
    if (c.learn > 0 && c.done === 0) btnDone.classList.remove('locked');
    if (c.done > 0) btnDone.classList.add('locked');
  }
  if (btnRevised) {
    btnRevised.classList.toggle('active', action === 'revised');
    // Unlock Revise once Learn clicked — stays re-clickable forever
    if (c.learn > 0) btnRevised.classList.remove('locked');
  }

  const cEl = document.getElementById(`c${action[0]}-${topicId}-${qIdx}`);
  if (cEl) cEl.textContent = c[action];

  updateSessionStats();
  renderNavbar('questions');
}

function resetQ(topicId, qIdx) {
  const key = `${topicId}::${qIdx}`;
  if (!qCounts[key]) qCounts[key] = { learn: 0, done: 0, revised: 0, reset: 0, last: null };
  qCounts[key].reset = (qCounts[key].reset || 0) + 1;

  // Reset all action counts but keep reset count
  qCounts[key].learn   = 0;
  qCounts[key].done    = 0;
  qCounts[key].revised = 0;
  qCounts[key].last    = null;

  // Persist to localStorage
  const qs  = Store.getQuestions();
  if (qs[key]) {
    qs[key].learnCount   = 0;
    qs[key].doneCount    = 0;
    qs[key].revisedCount = 0;
    qs[key].lastAction   = null;
    qs[key].resetCount   = qCounts[key].reset;
  } else {
    qs[key] = { learnCount:0, doneCount:0, revisedCount:0, lastAction:null, resetCount: qCounts[key].reset,
      chapter:0, chapter_title:'', section_id:'', section_num:'', q:'' };
  }
  Store.saveQuestions(qs);

  // Reset card state
  const card = document.getElementById(`qcard-${topicId}-${qIdx}`);
  if (card) card.classList.remove('state-learn','state-done','state-revised');

  const dot = document.getElementById(`dot-${topicId}-${qIdx}`);
  if (dot) { dot.className = 'state-dot'; dot.title = 'not started'; }

  // Reset buttons to initial state: Learn unlocked, Done/Revise locked, all inactive
  const btnLearn   = document.getElementById(`bl-${topicId}-${qIdx}`);
  const btnDone    = document.getElementById(`bd-${topicId}-${qIdx}`);
  const btnRevised = document.getElementById(`br-${topicId}-${qIdx}`);

  if (btnLearn)   { btnLearn.classList.remove('active','locked');   document.getElementById(`cl-${topicId}-${qIdx}`).textContent = 0; }
  if (btnDone)    { btnDone.classList.remove('active'); btnDone.classList.add('locked');    document.getElementById(`cd-${topicId}-${qIdx}`).textContent = 0; }
  if (btnRevised) { btnRevised.classList.remove('active'); btnRevised.classList.add('locked'); document.getElementById(`cr-${topicId}-${qIdx}`).textContent = 0; }

  // Update reset counter badge
  const cxEl = document.getElementById(`cx-${topicId}-${qIdx}`);
  if (cxEl) cxEl.textContent = qCounts[key].reset;

  updateSessionStats();
  renderNavbar('questions');
}

function applyFilters() {
  const checkedSecs    = Array.from(document.querySelectorAll('#section-filters input:checked')).map(i => i.value);
  const checkedStatus  = Array.from(document.querySelectorAll('#status-filters input:checked')).map(i => i.value);

  const filtered = allQuestions.filter(q => {
    if (!checkedSecs.includes(q.secId)) return false;
    const last = qCounts[`${q.topicId}::${q.qIdx}`]?.last || null;
    const status = last || 'none';
    return checkedStatus.includes(status);
  });
  renderQuestions(filtered);
}

function buildSectionFilters(sections) {
  document.getElementById('section-filters').innerHTML = sections.map(sec => `
    <label style="display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-bottom:7px;cursor:pointer;">
      <input type="checkbox" value="${sec.id}" checked onchange="applyFilters()"/>
      ${sec.icon} ${escHtml(sec.title.replace(/^\d+\.\s*/, ''))}
    </label>`).join('');
}

function toggleQ(bodyId, chevId) {
  const body = document.getElementById(bodyId);
  const chev = document.getElementById(chevId);
  const open = body.classList.toggle('open');
  if (chev) chev.style.transform = open ? 'rotate(90deg)' : '';
}

function expandAll()   {
  document.querySelectorAll('.q-body').forEach(b => b.classList.add('open'));
  document.querySelectorAll('.q-chev').forEach(c => c.style.transform = 'rotate(90deg)');
}
function collapseAll() {
  document.querySelectorAll('.q-body').forEach(b => b.classList.remove('open'));
  document.querySelectorAll('.q-chev').forEach(c => c.style.transform = '');
}

function openSidebar() {
  document.getElementById('sidebar-filters').classList.add('open');
  document.getElementById('sidebar-overlay').classList.add('open');
}
function closeSidebar() {
  document.getElementById('sidebar-filters').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

function init() {
  allSections  = window.AI_SECTIONS || [];
  qCounts      = Store.getQCounts();
  allQuestions = buildFlatList(allSections);
  window.TOTAL_TOPICS = allSections.reduce((a, s) => a + s.topics.length, 0);
  renderNavbar('questions');
  buildSectionFilters(allSections);
  renderQuestions(allQuestions);
}

init();
</script>
